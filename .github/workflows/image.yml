name: Image

# Builds the Gust image and publishes it to GHCR. The server installs and
# updates from ghcr.io/zephyron-tech/gust:latest (see docs/install.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: GUST_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/zephyron-tech/gust:latest
            ghcr.io/zephyron-tech/gust:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
