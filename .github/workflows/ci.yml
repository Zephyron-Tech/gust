name: CI

# Checks run on every pull request and every push to main. On main the Gust
# image is built and published to GHCR only after the checks pass. The server
# installs and updates from ghcr.io/zephyron-tech/gust:latest (see docs/install.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The web tests of project databases use a real database, migrated and seeded below.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gust
          POSTGRES_PASSWORD: gust
          POSTGRES_DB: gust
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U gust"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gust:gust@127.0.0.1:5434/gust
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway key for the test database
        run: echo "GUST_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Migrate and seed the test database
        run: pnpm --filter @gust/db db:migrate && pnpm --filter @gust/db db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test .github/actions/deploy/dockerfile.test.mjs
      - run: pnpm build

  image:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: GUST_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/zephyron-tech/gust:latest
            ghcr.io/zephyron-tech/gust:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
