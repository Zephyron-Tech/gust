name: Deploy demo app

# Test deploy of infra/demo-app to the production Gust. Runs on pushes to main
# that touch the demo app or the deploy action. dev is a preview branch: Gust
# serves it on its own host (see docs/github.md).
on:
  push:
    branches: [main, dev]
    paths:
      - infra/demo-app/**
      - .github/actions/deploy/**
      - .github/workflows/demo-deploy.yml
  pull_request:
    paths:
      - infra/demo-app/**
      - .github/actions/deploy/**
      - .github/workflows/demo-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token for Gust

concurrency:
  group: gust-demo
  cancel-in-progress: false

jobs:
  deploy:
    # Pull requests from forks get no OIDC token and no preview.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy
        with:
          gust-url: https://gust.zephyron.tech
          service: hello
          image: demo/hello
          context: infra/demo-app
          build-args: |
            VERSION=${{ github.sha }}
          registry-username: ${{ secrets.GUST_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.GUST_REGISTRY_PASSWORD }}
