# Gust on the VPS. Lives in /opt/gust next to its .env (written by
# install.sh); manage it with the `gust` command, not by hand.
#
# Networks:
#   gust_edge      Traefik, the web UI, the registry and every app Gust deploys
#   gust_internal  Postgres, socket proxy, engine, worker, web, registry
#   gust_control   Traefik and the engine only (routing config, Traefik API)
#   gust_data      Postgres and the apps of projects that have a database (docs/databases.md)
# Traefik never reaches the database or the Docker socket.
name: gust

x-app: &app
  image: ${GUST_IMAGE:-ghcr.io/zephyron-tech/gust:latest}
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=600s
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Wildcard certificates (GUST_WILDCARD_ZONES) over DNS-01 through the WEDOS API. Each
      # resolver needs its own storage file.
      - --certificatesresolvers.wedos.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.wedos.acme.storage=/letsencrypt/acme-wedos.json
      - --certificatesresolvers.wedos.acme.dnschallenge.provider=wedos
      - --providers.http.endpoint=http://engine:4100/internal/traefik
      - --providers.http.pollInterval=1s
      - --providers.http.headers.Authorization=Bearer ${ENGINE_TOKEN}
      - --providers.providersThrottleDuration=0s
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --api.insecure=true
      - --ping=true
      - --log.level=INFO
    environment:
      GUST_DOMAIN: ${GUST_DOMAIN}
      REGISTRY_DOMAIN: ${REGISTRY_DOMAIN}
      WEDOS_USERNAME: ${WEDOS_USERNAME:-}
      WEDOS_WAPI_PASSWORD: ${WEDOS_WAPI_PASSWORD:-}
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    ports:
      - 80:80
      - 443:443
    networks: [gust_edge, gust_control]
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

  # The only container with the Docker socket; the engine talks to Docker
  # through it, limited to the API sections deploys need.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EVENTS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      EXEC: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      BUILD: 0
      COMMIT: 0
      AUTH: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [gust_internal]
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gust
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gust
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [gust_internal, gust_data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gust]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

  # Shared Redis for project databases of kind redis (docs/databases.md). One
  # server, one ACL user per database, limited to its key prefix. The password
  # is required: without it apps on gust_data would reach every project's keys.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", --appendonly, "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis:/data
    networks: [gust_internal, gust_data]
    healthcheck:
      test: [CMD-SHELL, "redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

  # Gust's registry. Each project pushes with its own account (ci-<slug>) through
  # Traefik; the Docker daemon on this host pulls from 127.0.0.1:5050 with the
  # read-only "gust" account.
  zot:
    image: ghcr.io/project-zot/zot:v2.1.23
    restart: unless-stopped
    # The worker writes config.json and htpasswd (one account per project) into registry-auth.
    command: [serve, /etc/zot-auth/config.json]
    volumes:
      - registry-auth:/etc/zot-auth:ro
      - zot:/var/lib/registry
    ports:
      - 127.0.0.1:5050:5000
    networks: [gust_edge, gust_internal]
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

  migrate:
    <<: *app
    command: [migrate]
    restart: "no"
    environment:
      DATABASE_URL: postgres://gust:${POSTGRES_PASSWORD}@postgres:5432/gust
    depends_on:
      postgres: { condition: service_healthy }
    networks: [gust_internal]

  engine:
    <<: *app
    command: [engine]
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      TRAEFIK_API: http://traefik:8080
      ENGINE_TOKEN: ${ENGINE_TOKEN}
      HOST: 0.0.0.0
      PORT: 4100
      GUST_TLS_RESOLVER: ${GUST_TLS_RESOLVER-le}
      # Zones with a wildcard DNS record, e.g. zephyron.tech,gust.zephyron.tech. Empty = HTTP-01 only.
      GUST_WILDCARD_ZONES: ${GUST_WILDCARD_ZONES:-}
      GUST_WILDCARD_RESOLVER: wedos
      REGISTRY_HOST: 127.0.0.1:5050
      REGISTRY_USERNAME: gust
      REGISTRY_PASSWORD: ${REGISTRY_PULL_PASSWORD}
    depends_on: [socket-proxy]
    networks: [gust_internal, gust_control]

  web:
    <<: *app
    command: [web]
    environment:
      DATABASE_URL: postgres://gust:${POSTGRES_PASSWORD}@postgres:5432/gust
      ENGINE_URL: http://engine:4100
      ENGINE_TOKEN: ${ENGINE_TOKEN}
      REGISTRY_URL: http://zot:5000
      REGISTRY_HOST: 127.0.0.1:5050
      REGISTRY_USERNAME: gust
      REGISTRY_PASSWORD: ${REGISTRY_PULL_PASSWORD}
      BETTER_AUTH_URL: ${GUST_URL:-https://${GUST_DOMAIN}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      GUST_ADMIN_GROUP: ${GUST_ADMIN_GROUP:-gust-admin}
      GUST_MASTER_KEY: ${GUST_MASTER_KEY}
      GITHUB_OIDC_AUDIENCE: ${GITHUB_OIDC_AUDIENCE:-${GUST_DOMAIN}}
      GITHUB_ALLOWED_OWNERS: ${GITHUB_ALLOWED_OWNERS:-Zephyron-Tech}
      BREAK_GLASS_EMAIL: ${BREAK_GLASS_EMAIL}
      BREAK_GLASS_PASSWORD: ${BREAK_GLASS_PASSWORD}
      GUST_SERVER_IP: ${GUST_SERVER_IP:-}
      GUST_DOMAIN: ${GUST_DOMAIN}
      # Automatic host for a project's main branch: <slug>.<GUST_TEMP_DOMAIN>.
      GUST_TEMP_DOMAIN: ${GUST_TEMP_DOMAIN:-}
      REGISTRY_DOMAIN: ${REGISTRY_DOMAIN}
      # Only whether a Discord webhook is set; the URL itself stays on the host.
      DISCORD_SET: ${DISCORD_WEBHOOK_URL:+yes}
      # Only whether a heartbeat URL is set; the URL itself stays on the host.
      HEARTBEAT_SET: ${HEARTBEAT_URL:+yes}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      # Only whether a key is set; the key itself never reaches the web container.
      GITHUB_APP_KEY_SET: ${GITHUB_APP_PRIVATE_KEY:+yes}
      # Only this folder is shared with the host: update requests in, status.json out.
      GUST_REQUESTS_DIR: /gust-requests
    volumes:
      - ./requests:/gust-requests
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [gust_edge, gust_internal]

  worker:
    <<: *app
    command: [worker]
    environment:
      BACKUP_DIR: /backups
      DATABASE_URL: postgres://gust:${POSTGRES_PASSWORD}@postgres:5432/gust
      REDIS_ADMIN_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      ENGINE_URL: http://engine:4100
      ENGINE_TOKEN: ${ENGINE_TOKEN}
      REGISTRY_HOST: 127.0.0.1:5050
      GUST_MASTER_KEY: ${GUST_MASTER_KEY}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GUST_PUBLIC_URL: ${GUST_URL:-https://${GUST_DOMAIN}}
      GUST_DOMAIN: ${GUST_DOMAIN}
      # Custom domains are verified against it before they are routed.
      GUST_SERVER_IP: ${GUST_SERVER_IP:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Registry accounts: the worker writes Zot's files, then the engine restarts Zot.
      REGISTRY_AUTH_DIR: /registry-auth
      REGISTRY_PULL_PASSWORD: ${REGISTRY_PULL_PASSWORD}
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - ./backups:/backups
      - registry-auth:/registry-auth
    networks: [gust_internal]

networks:
  gust_edge:
    name: gust_edge
  gust_internal:
    name: gust_internal
  gust_control:
    name: gust_control
  gust_data:
    name: gust_data

volumes:
  postgres:
  redis:
  zot:
  letsencrypt:
  registry-auth:
